###############################################################################
# .github/workflows/terraform.yml
# CI/CD: validate + plan on PR, apply on merge to main (per environment)
###############################################################################
name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'

env:
  TF_VERSION: "1.7.5"
  # Credentials injected from GitHub Secrets
  HW_ACCESS_KEY:   ${{ secrets.HW_ACCESS_KEY }}
  HW_SECRET_KEY:   ${{ secrets.HW_SECRET_KEY }}
  HW_REGION_NAME:  ${{ secrets.HW_REGION_NAME }}
  HW_DOMAIN_NAME:  ${{ secrets.HW_DOMAIN_NAME }}
  HW_CLOUD_TYPE:   "private"
  HW_AUTH_URL:     ${{ secrets.HW_AUTH_URL }}
  # OBS backend (S3-compatible)
  AWS_ACCESS_KEY_ID:     ${{ secrets.HW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_SECRET_KEY }}

jobs:
  # ─── Validation (always runs) ─────────────────────────────────────────────
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: Validate dev
        working-directory: environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  # ─── Plan on Pull Request ─────────────────────────────────────────────────
  plan-dev:
    name: Plan — dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        working-directory: environments/dev
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket                      = "${{ secrets.TF_STATE_BUCKET }}"
              key                         = "dev/terraform.tfstate"
              region                      = "${{ secrets.HW_REGION_NAME }}"
              endpoint                    = "${{ secrets.OBS_ENDPOINT }}"
              skip_credentials_validation = true
              skip_region_validation      = true
              skip_metadata_api_check     = true
              force_path_style            = true
            }
          }
          EOF

      - name: terraform init
        working-directory: environments/dev
        run: terraform init

      - name: terraform plan
        working-directory: environments/dev
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan — dev
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ─── Apply on merge to main ───────────────────────────────────────────────
  apply-dev:
    name: Apply — dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev   # requires manual approval in GitHub Environments settings
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        working-directory: environments/dev
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket                      = "${{ secrets.TF_STATE_BUCKET }}"
              key                         = "dev/terraform.tfstate"
              region                      = "${{ secrets.HW_REGION_NAME }}"
              endpoint                    = "${{ secrets.OBS_ENDPOINT }}"
              skip_credentials_validation = true
              skip_region_validation      = true
              skip_metadata_api_check     = true
              force_path_style            = true
            }
          }
          EOF

      - name: terraform init
        working-directory: environments/dev
        run: terraform init

      - name: terraform apply
        working-directory: environments/dev
        run: |
          terraform apply \
            -var-file="terraform.tfvars" \
            -auto-approve
